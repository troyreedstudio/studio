name: pineapple
description: "A new Flutter project."



version: 1.3.2+27
# build 4: 1.2.0+4, 7 March 2026
# build 5: 1.2.0+5, 16 April 2026 — venue search, Instagram/WhatsApp, Google Places
# build 6: 1.2.0+6, 17 April 2026 — booking WebView, ratings, curated schedule, Day Zero, gyms
# build 7: 1.2.0+7, 17 April 2026 — Plan My Night, Live Vibe Check, full sales demo build
# build 8: 1.2.0+8, 21 April 2026 — curated restaurants, profile fixes, Up late, 70 venues, vibe renames
# build 9: 1.2.0+9, 3 May 2026 — PP ratings + vibe system, refer-a-friend, distance ranking, favorites bug fix, dual rating display, interim app icon
# build 10: 1.2.0+10, 10 May 2026 — hero photo carousel, cross-category filter, Plan My Night auto-save, wishlist UI, Google Places search tap-out + attribution, branded OTP/admin emails via own Brevo, info@pinkpineapple.app sender, 75 venues with rebuilt Google Places photos
# build 11: 1.3.0+11, 19 May 2026 — VIP table booking (3-button CTA + WhatsApp deep-link to Pink Pineapple Business + attribution), Plan My Night v1.3 (cuisine + genre filters, Refine button, tonight banner on bookings), floor plan viewer, vibe check removed from venue detail, profile/onboarding/forgot-password fixes, cuisines + music genres on venue model
# build 12: 1.3.0+12, 19 May 2026 — hotfix: 3-button CTA on venue detail was gated on the wrong category string ('NIGHT_CLUB' instead of 'NIGHTLIFE') so nightclubs fell back to the legacy single 'Book a Table' button instead of showing Guest List | Buy Tickets | Book VIP Table
# build 13: 1.3.0+13, 23 May 2026 — Plan My Night completion (peakDays-driven generator, save-conflict dialog Replace/Keep both/Cancel, explicit Save CTA), Bookings tab (Tonight banner, Rate Where You Went + Share The Vibe consistent pink-outline cards with tap-to-modal rating, auto-refresh on tab focus), venue detail booking CTAs by category, VIP sheet WhatsApp Business number + IDR-only spend dropdown, landscape floor plan, Welcome (not Welcome Back), backend nightlifeTier/peakDays/closesAtHour curation, dashboard timing fields on new + edit + club portal
# build 14: 1.3.0+14, 23 May 2026 — sign-up + onboarding fixes. (a) Sign-up "Create Account" silent-fail: bypassed InternetConnectionChecker outer guard that was eating POST requests on phones blocking Cloudflare/Google DNS, added 30s timeout + explicit SocketException/TimeoutException handling on POST with user-visible error message, surfaced registerUser catch errors via snackbar (was previously commented out), null-guarded response handling so a swallowed network error doesn't crash on response['data']. (b) Profile setup "You are not authorized": sign-up OTP flow was calling /auth/verify-otp (forgot-password endpoint) instead of /auth/verify-register-otp, AND was discarding the accessToken from the response. Fixed: added Urls.verifyRegisterOTP, otpVerifyToLogin now hits the right endpoint and persists accessToken to LocalService so the subsequent profile-photo multipart upload has an Authorization header. Also fires welcome email + flips user.status to ACTIVE as a side effect of using the correct endpoint.
# build 15: 1.3.0+15, 24 May 2026 — onboarding overhaul. (a) Single-page sign-up: 9 fields on one screen (firstName/lastName split + gender/DOB/country-of-origin/email/phone/Instagram/password). No more step-3 profile setup screen — OTP success now navigates straight to home (kills the entire 401-on-profile-upload bug class). (b) Email field forces lowercase as user types + autocaps off + denies whitespace — prevents iOS auto-cap from creating duplicate accounts (Foo@gmail.com vs foo@gmail.com). (c) Backend: all 6 email lookups in Auth.service.ts + the createUserIntoDb lookup in user.services.ts now lowercase email at both read and write so case mismatches can't lock anyone out or create duplicates. (d) Backend: createUserIntoDb accepts firstName/lastName/country, composes fullName for backward compat. (e) Schema: added firstName + lastName + (kept fullName) on User model. (f) Backfill ran on Hostinger: 9 mixed-case emails lowercased, 56 existing fullNames split into firstName/lastName, 21 testers stuck INACTIVE flipped to ACTIVE. (g) Anonymized 5 broken duplicate test accounts (Olga × 2, Saon × 3) so their real emails are free to re-sign-up. (h) Removed photo + city + fullAddress from sign-up payload (deferred to later edit-profile flow).
# build 16: 1.3.0+16, 24 May 2026 — post-1.3.0+15 polish based on Troy's live testing of Sascha's iPhone. (a) Loading-profile-forever bug fixed: Get.delete<UserInfoController>() then put on both login + OTP success so fetchUserInfo actually runs (previously the controller was stuck in memory from a prior failed session with userInfo=null). (b) Self-healing on bad token: network_config GET handler clears LocalService on 401/404 so stale JWTs (e.g. token issued for a deleted user) auto-resolve to login instead of infinite "Loading profile". (c) Country picker on sign-up is now searchable (reuses the existing country_code_picker — type "UN" → jumps to United States, no more scrolling through 200 flags). (d) Edit Profile rebuilt to surface 8 of the 9 sign-up fields: First Name, Last Name, Gender (dropdown), DOB (existing), Country (searchable picker, country of origin), Email, Instagram, Phone (existing) — kills the long-standing mismatch where profile edit asked for unrelated fields (User Name, Address, Bio) that sign-up never captured. (e) Backend getMyProfile select now returns firstName/lastName/gender so the Flutter UserProfile model can render them. (f) Backend updateProfile now accepts firstName/lastName/lowercased email so edit-profile saves the new fields and can't introduce case mismatches.
# build 17: 1.3.0+17, 25 May 2026 — three fixes from Chase's 1.3.0+16 testing on Sascha's iPhone. (a) UserInfoController now `permanent: true` on login + OTP — without this, the controller was being silently disposed when Get.offAll popped the previous route, which made every Get.to() to ProfileEditScreen / UserProfilePage do nothing (their field-init Get.find<UserInfoController>() threw at construction and the navigator swallowed the throw). Killing the profile-tap-dead bug. (b) PlanMyNightStorage.clear() now fires on login + OTP success so leftover state from a previous user on the same device (e.g. Sascha's plan persisting after Chase signs up) doesn't auto-restore Plan My Night to step 2 (group size) with stale data — Chase saw this as "Plan My Night skipped vibe selection". (c) Post-save flow upgraded from a 2-second snackbar to a full confirmation bottom-sheet with a "VIEW IN MY BOOKINGS" CTA that closes Plan My Night and switches to the Bookings tab. Previously testers couldn't tell if their plan had saved + had no clear path to view it.
# build 18: 1.3.0+18, 25 May 2026 — two fixes from Troy + Sascha testing 1.3.0+17. (a) Bookings tab "No bookings yet" empty state was firing for users without Booking records (i.e. anyone who hasn't table-booked via Stripe) — bypassing the entire Tonight's Plan banner / Rate Where You Went / Share The Vibe sections that are actually driven by NightPlan data. The gate has been there since initial commit but in v1.3.0+13 I built the new sections INSIDE the gate instead of moving them outside. Removed the early-return: _ItineraryList always renders now, each section self-hides if empty. Sascha's saved NightPlan now correctly appears as Tonight's Plan banner. (b) Profile consolidation: tapping the header card on Profile tab now goes straight to ProfileEditScreen instead of the legacy UserProfilePage (which showed obsolete fields like @ and "no address" that aren't even captured at sign-up). Removed the redundant "Edit Profile" menu tile — one profile area, one tap.
# build 19: 1.3.0+19, 25 May 2026 — Profile Settings name typography fix. Per Troy's screenshot the name under the avatar circle was rendering in cormorantGaramond (serif) instead of the brand's Outfit bold italic. Aligned it to match the rest of the brand (same style used on the Profile tab header card + venue names everywhere). Also bumped size 16sp → 18sp for visual weight under the larger avatar circle.
# build 20: 1.3.0+20, 25 May 2026 — Removed hardcoded Day Zero Bali filler tile from the Featured Events home carousel. The event had passed in April 2026 and there was no admin surface to remove or update it. _fillerEvents array deleted from home.dart. Featured Events now strictly reflects real backend events from the Events admin (newly renamed "Featured Events" in the dashboard nav with optional venue, page heading, Quick Action card, and stat label all updated for consistency). Empty section shows "No featured events yet" copy.
# build 21: 1.3.0+21, 25 May 2026 — Translucent logo test on the login screen. Per repeated tester feedback that the JPG-on-black-box logo looks boxy, swapped the login screen's logo to the new transparent rose-gold gradient PNG (assets/images/app_logo_transparent.png). Login is the test surface only — if it reads well, roll out across the rest of the app + email templates + dashboard. All other surfaces (splash, header bars, profile tab, dashboard, emails) still use the original app_logo_dark.jpg until the test passes.
# build 22: 1.3.0+22, 26 May 2026 — Featured Events card fixes from Troy's testing. (a) Card was showing the admin user's name (Troy Reed / Rowan itsjusreal) instead of the actual linked venue (Savaya) — backend Events list select now includes venue { id, name, slug, area }; AllEventModel parses venue via new EventVenue class; home _toCardData uses event.venue?.name with a fallback to empty string for standalone events. (b) Card had a huge gray dead zone below the image because the long description field was never rendered anywhere — card now shows venue · area, then time, then up to 3 lines of description with proper ellipsis. (c) Card height 220 → 280 and image height 110 → 160 so the gig poster reads properly and the description block has room.
# build 23: 1.3.0+23, 26 May 2026 — Tappable Featured Event cards. Troy reported the new bookingUrl field on Featured Events wasn't doing anything — cards were inert. Backend Events list select now returns bookingUrl + bookingProvider (event-level) and the venue subselect adds bookingUrl / bookingProvider / bookingDailyUrls so we can fall back to the venue's ticket link when an event has none. AllEventModel + EventVenue parse the new fields. home.dart _toCardData computes ticketUrl = event.bookingUrl ?? venue.bookingUrl ?? '' and the existing _FeaturedEventCard.onTap opens VenueBookingWebView with it (no-op when both are empty). Same dashboard image cropper landed earlier in the day so editors can frame 16:9 hero art without pre-sizing.
# build 24: 1.3.1+24, 31 May 2026 — Featured Events flipped to 9:16 portrait video tiles. Cards 180x320 then shrunk to 155x275 so 2 fit per screen + peek of 3rd. Auto-playing muted looping video via video_player package; static image fallback when no eventVideoUrl. Sort: video-having events first, then by startDate. Dot row below carousel. Backend Events.eventVideoUrl field + all 4 list selects updated + create/update accept multipart eventVideo file (Cloudinary uploadToCloudinary resource_type:auto handles video natively) + falls back to pasted URL when only that's provided. Dashboard ImageCropperModal aspectRatio flipped 16:9→9:16 on event create + edit. New VideoPicker component with drag-drop + live preview + dimensions/duration/size validation badges. Same drop landed Send Notification scheduling — ScheduledNotification Prisma model + admin /notifications/schedule + /scheduled + DELETE /scheduled/:id routes + 60s setInterval worker in server.ts that picks PENDING rows whose scheduledFor passed and fans them out via the same sendEachForMulticast path the immediate broadcast uses. Dashboard Send Notification page rewritten with Send-now/Schedule toggle, datetime-local picker, and a Scheduled+recent audit table with status pills + per-row Cancel for PENDING rows.
# build 25: 1.3.1+25, 31 May 2026 — Restaurant booking CTA honesty + schedule end-time backfill. Troy testing flagged Miss Fish "BOOK A TABLE" button opens Instagram (mismatch), Il Salotto "BOOK A TABLE" shows "Coming Soon" snackbar despite having a website, and Miss Fish weekly schedule shows start time but the end time (00:00 in seed data) reads as midnight when actual close is 05:00. (a) Restaurant branch in venue_detail_screen now uses a fallback chain: real bookingUrl → "BOOK A TABLE", else INSTAGRAM_DM + handle → "DM ON INSTAGRAM", else website → "VISIT WEBSITE", else hide the button entirely. Label always matches destination. (b) _openBooking() now falls back through INSTAGRAM_DM handle then venue.website before the no-op safety branch, so the "Booking Coming Soon" snackbar is removed (always lands somewhere or button is hidden upstream). (c) Data: ran backfill script against production — 6 venues had weeklySchedule.endTime="00:00" placeholders. Backfilled from real openingHours close times: Miss Fish tue-sat 00:00→05:00, Finns sun→22:00, La Brisa wed/sun→23:00, El Kabron sun→23:00, Single Fin mon/wed→23:00 sun→01:00, Potato Head sun→22:00.
# build 26: 1.3.1+26, 1 Jun 2026 — Polish pass on the restaurant booking flow + tourist-friendly time format. Four landed together: (a) Restaurant button label always says "BOOK A TABLE" when the destination is a website (sleek, intent-matching) — INSTAGRAM_DM only labels "DM ON INSTAGRAM" when there's no website at all. Order: bookingUrl → website → INSTAGRAM_DM handle → hide. (b) Backend BookingClick.controller now mirrors the same priority — website beats contact-only providers when no real bookingUrl exists. Without this the Flutter fallback was overridden at the attribution layer (Miss Fish kept getting ig.me URLs even after the frontend fix). (c) Plain restaurant websites (http://luigishotpizza.com style) now open in Safari via LaunchMode.externalApplication instead of the in-app WebView — iOS App Transport Security was blocking http loads inside WKWebView, causing taps to land on a blank/idle screen. WebView reserved for real booking platforms (booketing/mtix/crowdstack — all https with JS auto-fill). (d) 24-hour → 12-hour AM/PM render via new time_formatter.dart helper. "18:00–01:00" becomes "6 PM – 1 AM" on Best Nights to Visit, This Week cards, and Featured Event time fields. Backend storage stays 24-hour (matches Google Places + IG convention); conversion happens at render only. Plus data: Il Salotto sat/sun endTime 01:00 → 04:00 (after-party close per Troy's local knowledge).
# build 27: 1.3.2+27, 1 Jun 2026 — Push notifications Part B (Flutter side). Troy created the Firebase project (pink-pineapple-76396), added iOS + Android apps, uploaded the APNs Auth Key (Key ID 262ZKB5L9L, Team YNCLWQN2B8) to both dev and prod slots, generated the service-account JSON. Flutter wiring: firebase_core ^3.8.0 + firebase_messaging ^15.1.5 added; main.dart initialises Firebase + kicks off PushNotificationService.init() at app start; new core/services/push_notification_service.dart handles permission request, APNs token retrieval (iOS), FCM token capture + onTokenRefresh, foreground message handler (snackbar via Get), background/cold-start tap handlers. Login + OTP success flows fire-and-forget registerCurrentToken() so the first sign-in lands a token without waiting for the next refresh cycle. Backend env: FIREBASE_PROJECT_ID + FIREBASE_CLIENT_EMAIL + FIREBASE_PRIVATE_KEY added to .env on Hostinger; firebaseAdmin.ts hardened with .replace(/\\\\n/g,'\\n') for the PEM key and guarded re-init via admin.apps.length check ("Firebase Admin SDK initialized successfully!" confirmed in server logs). iOS native: Runner.entitlements added with aps-environment=production; CODE_SIGN_ENTITLEMENTS wired through Debug + Release xcconfig; UIBackgroundModes [remote-notification, fetch] added to Info.plist. Android: com.google.gms.google-services 4.4.2 declared in settings.gradle.kts plugin block and applied in app/build.gradle.kts. End-to-end test plan: install 1.3.2+27 via TestFlight, log in (token POSTed to /users/fcm-token), fire a broadcast from dashboard /notifications → expect push to land on the test device.

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter


  cupertino_icons: ^1.0.8
  flutter_easyloading: ^3.0.5
  flutter_screenutil: ^5.9.3
  font_awesome_flutter: ^10.12.0
  get: ^4.6.6
  google_fonts: ^6.2.1
  http: ^1.2.2
  shared_preferences: ^2.3.3
  fluttertoast: ^8.2.8
  internet_connection_checker: ^1.0.0+1
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  permission_handler: ^11.3.1
  file_picker: ^10.2.0
  google_nav_bar: ^5.0.7
  lottie: ^3.3.2
  change_app_package_name: ^1.5.0
  intl: ^0.20.2
  loading_animation_widget: ^1.3.0
  pin_code_fields: ^8.0.1
  logger: ^2.6.2
  flutter_svg: ^2.2.1
  carousel_slider: ^5.1.1
  flutter_launcher_icons: ^0.14.4
  web_socket_channel: ^3.0.3
  upgrader: ^12.5.0
  url_launcher: ^6.3.1
  webview_flutter: ^4.13.1
  share_plus: ^10.1.4
  # v1.3.1+24: 9:16 portrait promo video on Featured Event cards.
  # Auto-plays muted + looping in-card; falls back to static image.
  video_player: ^2.9.2
  # v1.3.2+27: push notifications. firebase_core boots Firebase from
  # the GoogleService-Info.plist (iOS) / google-services.json
  # (Android) we drop into the platform folders.
  # firebase_messaging captures the FCM token + handles
  # foreground/background message delivery.
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/images/app_icon.png"
    background_color: "#000000"
    theme_color: "#000000"
  windows:
    generate: true
    image_path: "assets/images/app_icon.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/images/app_icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/images/
    - assets/icons/
    - assets/animation/
    - assets/jsons/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

